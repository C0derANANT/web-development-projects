<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="MathWIZ: a maths series generator, a graph plotter and a 3D shapes viewer in one page." />
  <title>MathWIZ</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 height=%2232%22 width=%2232%22><text y=%2224%22 font-size=%2224%22>📐</text></svg>">
  <link rel="stylesheet" href="style.css" />

  <!-- Libraries -->
  <script src="https://www.geogebra.org/apps/deployggb.js"></script>                                   <!-- Graph Plotter -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0"></script>                              <!-- moving background -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>                <!-- 3D Shapes -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/controls/OrbitControls.min.js"></script>
</head>
<body>
  <div id="particles-js" aria-hidden="true"></div>

  <button id="toggleBtn" type="button" aria-controls="sidebar" aria-expanded="false">☰ Menu</button>

  <nav id="sidebar" aria-label="Pages">
    <a href="#" data-page="home">🏠 Home</a>
    <a href="#" data-page="series">🔢 Series Generator</a>
    <a href="#" data-page="graph">📈 Graph Plotter</a>
    <a href="#" data-page="shapes">🧊 3D Shapes</a>
  </nav>

  <header>MathWIZ</header>

  <!-- script.js copies one of the page templates below into here -->
  <main id="content"></main>


  <!-- ========== Page templates ========== -->

  <!-- Home -->
  <template id="page-home">
    <section class="card">
      <h2>Welcome 👋</h2>
      <p class="intro">
        Use the menu to explore: a powerful <b>Series Generator</b>, a GeoGebra-based <b>Graph Plotter</b>,
        and a <b>3D Shapes</b> viewer powered by Three.js.
      </p>
      <div class="output fact-box" id="factBox"></div>
    </section>
  </template>

  <!-- Series Generator -->
  <template id="page-series">
    <section class="card">
      <h3>Math Series Generator</h3>
      <div class="controls-row">
        <label>First Term (a): <input type="number" id="firstTerm" value="1"></label>
        <label>Diff/Ratio (d or r): <input type="number" id="common" value="1"></label>
        <label>Terms (n): <input type="number" id="terms" value="10" min="1" max="500" step="1"></label>
      </div>
      <div class="controls-row">
        <button type="button" data-series="ap">Generate AP</button>
        <button type="button" data-series="gp">Generate GP</button>
        <button type="button" data-series="hp">Generate HP</button>
        <button type="button" data-series="fibonacci">Fibonacci</button>
      </div>
      <div class="output" id="output"></div>
    </section>
  </template>

  <!-- Graph Plotter -->
  <template id="page-graph">
    <section class="card">
      <h3>Interactive Graphing Calculator</h3>
      <div id="ggb-element"></div>
    </section>
  </template>

  <!-- 3D Shapes -->
  <template id="page-shapes">
    <section class="card">
      <h3>3D Shapes Viewer</h3>
      <div class="shape-picker">
        <label for="shapeSelect">Choose shape: </label>
        <select id="shapeSelect">
          <option value="cube">Cube</option>
          <option value="sphere">Sphere</option>
          <option value="cone">Cone</option>
        </select>
      </div>
      <div id="shapeContainer"></div>
    </section>
  </template>


  <script src="script.js"></script>
</body>
</html>
